<head><meta charset="utf-8"><title>DialogueBox — preview</title></head>
<body>
<div class="wl-stage"><div id="root"></div></div>
<script>
  var W = window.Wishlight, h = React.createElement;

    speaker: 'Bạn đồng hành', emotion: 'happy', auto: true,
    text: 'Ê ê, nhà lữ hành! Hôm nay bạn về muộn quá đó nha. Có muốn kể mình nghe chuyện gì đã xảy ra không?',

</script>
