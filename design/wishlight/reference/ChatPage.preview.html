<!-- @dsCard group="Pages" height=560 subtitle="Trang chat chi tiết" width=960 page -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChatPage — preview</title></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wishlight, h = React.createElement;
  function Page() {
    var v = React.useState('');
    return h('div', { className: 'wl-page' },
      h('aside', { className: 'wl-side' }, h('h2', null, 'Nhật ký'),
        h(W.ConversationItem, { title: 'Kế hoạch cuối tuần', time: '21:03', snippet: 'Tối nay gợi ý mình món gì đi?', current: true }),
        h(W.ConversationItem, { title: 'Học tiếng Nhật', time: 'Hôm qua', snippet: 'Mình ôn lại bảng Katakana nhé…' }),
        h(W.ConversationItem, { title: 'Chào buổi sáng', time: 'T2', snippet: 'Dậy chưa đó, sâu ngủ?' })),
      h('main', { className: 'wl-main' },
        h('header', { className: 'wl-main-head' }, h('h1', null, 'Kế hoạch cuối tuần'), h(W.Button, { variant: 'secondary', icon: 'play' }, 'Về sân khấu')),
        h('div', { className: 'wl-thread' },
          h('div', { className: 'wl-daysep' }, h(W.Icon, { name: 'star' }), 'Hôm nay', h(W.Icon, { name: 'star' })),
          h(W.ChatBubble, { from: 'ai', name: 'Bạn đồng hành', emotion: 'happy', time: '21:01', voice: '0:04' }, 'Về rồi đó hả! Cuối tuần này có định đi đâu không?'),
          h(W.ChatBubble, { from: 'user', time: '21:02' }, 'Chưa biết nữa, chắc ở nhà cày game.'),
          h(W.ChatBubble, { from: 'ai', name: 'Bạn đồng hành', emotion: 'angry', time: '21:02', voice: '0:07' }, 'Lại ở nhà! Ít nhất cũng ra công viên đi dạo một vòng với mình chứ.'),
          h(W.ChatBubble, { from: 'user', time: '21:03' }, 'Rồi rồi. Tối nay gợi ý mình món gì đi?'),
          h(W.ChatBubble, { from: 'ai', name: 'Bạn đồng hành', typing: true })),
        h('div', { className: 'wl-main-foot' }, h(W.ChatComposer, { value: v[0], onChange: function (e) { v[1](e.target.value); } }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
